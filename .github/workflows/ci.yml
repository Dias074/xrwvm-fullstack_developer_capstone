name: Build and test Best Cars
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: pip install -r server/requirements.txt
      - name: Build React frontend
        run: cd server/frontend && npm ci && npm run build
      - name: Check Django and run tests
        run: cd server && python manage.py check && python manage.py test
      - name: Validate Node service syntax
        run: node --check server/database/app.js
